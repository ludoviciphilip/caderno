name: Bug report
description: Something in Caderno doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: What did you do, step by step, before the problem showed up?
      placeholder: |
        1. Open a notebook
        2. Draw a line with the pen
        3. ...
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Linux distribution
      placeholder: e.g. Arch Linux, Fedora 40, Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: GTK4 / libadwaita versions
      description: Output of `pkg-config --modversion gtk4 libadwaita-1` if you have it
      placeholder: e.g. gtk4 4.14.4, libadwaita 1.5.1
    validations:
      required: false

  - type: input
    id: desktop
    attributes:
      label: Desktop environment / compositor
      placeholder: e.g. GNOME 46, Hyprland, KDE Plasma
    validations:
      required: false

  - type: dropdown
    id: input-device
    attributes:
      label: Input device
      options:
        - Pen tablet (Wacom)
        - Pen tablet (XP-Pen or other)
        - Mouse / trackpad only
        - Touchscreen
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Terminal output
      description: Run `caderno` (or `python -m caderno`) from a terminal and paste any errors/tracebacks here.
      render: shell
    validations:
      required: false
